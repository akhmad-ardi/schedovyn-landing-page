<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- Outer sharp technical blueprint frame -->
  <rect x="4" y="4" width="40" height="40" stroke="#1547E6" stroke-width="2.5" fill="none"/>
  <!-- Top bar header -->
  <line x1="4" y1="16" x2="44" y2="16" stroke="#1547E6" stroke-width="2"/>
  <!-- Vertical separator column -->
  <line x1="18" y1="4" x2="18" y2="44" stroke="#1547E6" stroke-width="2"/>
  <line x1="32" y1="16" x2="32" y2="44" stroke="#1547E6" stroke-width="1.5" stroke-dasharray="2 2"/>
  <!-- Middle time slot row -->
  <line x1="18" y1="28" x2="44" y2="28" stroke="#1547E6" stroke-width="1.5"/>
  <!-- Active session block -->
  <rect x="20.5" y="18.5" width="9" height="7" fill="#1547E6"/>
  <!-- Secondary session block -->
  <rect x="34.5" y="30.5" width="7" height="11" fill="#1547E6" fill-opacity="0.6"/>
  <!-- Time column indicator dots -->
  <rect x="7" y="20" width="7" height="2" fill="#1547E6"/>
  <rect x="7" y="32" width="7" height="2" fill="#1547E6"/>
</svg>
